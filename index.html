<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Surya Partap Singh — Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="hero">
    <div class="hero-inner">
      <div class="photo-wrap">
        <img id="photo" src="images/profile.jpg" alt="Profile photo" onerror="this.style.display='none'; document.getElementById('initials').style.display='flex';">
        <div id="initials" class="initials">SS</div>
      </div>
      <div class="hero-text">
        <p class="eyebrow" id="status">Open to opportunities</p>
        <h1 id="name">Loading...</h1>
        <p class="role" id="title"></p>
        <p class="location" id="location"></p>
        <div class="hero-links">
          <a id="email" href="#" class="btn btn-primary">Email me</a>
          <a id="linkedin" href="#" target="_blank" class="btn btn-outline">LinkedIn</a>
          <a id="github" href="#" target="_blank" class="btn btn-outline">GitHub</a>
        </div>
      </div>
    </div>
  </header>

  <main>
    <section class="card">
      <h2>Summary</h2>
      <p id="summary"></p>
    </section>

    <section class="card">
      <h2>Skills</h2>
      <ul id="skills" class="pill-list"></ul>
    </section>

    <section class="card">
      <h2>Experience</h2>
      <div id="experience" class="timeline"></div>
    </section>

    <section class="card">
      <h2>Education</h2>
      <div id="education"></div>
    </section>
  </main>

  <footer>
    <p>&copy; <span id="year"></span> Surya Partap Singh</p>
  </footer>

<script>
document.getElementById('year').textContent = new Date().getFullYear();

fetch('content/data.json?_=' + Date.now())
  .then(r => r.json())
  .then(data => {
    document.getElementById('name').textContent = data.name;
    document.getElementById('title').textContent = data.title;
    document.getElementById('location').textContent = data.location + '  ·  ' + data.phone;

    const email = document.getElementById('email');
    email.textContent = 'Email me';
    email.href = 'mailto:' + data.email;

    const li = document.getElementById('linkedin');
    li.href = data.linkedin;

    const gh = document.getElementById('github');
    gh.href = data.github;

    const initials = data.name.split(' ').map(n => n[0]).slice(0,2).join('');
    document.getElementById('initials').textContent = initials;

    document.getElementById('summary').textContent = data.summary;

    const skillsEl = document.getElementById('skills');
    data.skills.forEach(s => {
      const li = document.createElement('li');
      li.textContent = s;
      skillsEl.appendChild(li);
    });

    const expEl = document.getElementById('experience');
    data.experience.forEach((e, i) => {
      const div = document.createElement('div');
      div.className = 'timeline-item';
      div.innerHTML = `<div class="timeline-marker"><span class="node"></span>${i < data.experience.length - 1 ? '<span class="line"></span>' : ''}</div>
        <div class="timeline-body">
          <p class="period">${e.period}</p>
          <h3>${e.role}</h3>
          <p class="company">${e.company}</p>
          <p class="desc">${e.description}</p>
        </div>`;
      expEl.appendChild(div);
    });

    const eduEl = document.getElementById('education');
    data.education.forEach(ed => {
      const div = document.createElement('div');
      div.className = 'entry';
      div.innerHTML = `<h3>${ed.degree}</h3>
        <p class="meta">${ed.school} &middot; ${ed.period}</p>`;
      eduEl.appendChild(div);
    });
  })
  .catch(err => {
    document.getElementById('name').textContent = 'Error loading content';
    console.error(err);
  });
</script>
</body>
</html>
